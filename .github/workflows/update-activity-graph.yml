name: Update daily activity graph

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [update-stats]
  push:
    branches:
      - main
    paths:
      - "scripts/**"
      - ".github/workflows/**"

permissions:
  contents: write

jobs:
  update-graph:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate activity visuals
        env:
          GITHUB_USERNAME: RichardBijuJohn
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_activity_graph.py

      - name: Commit updated graph
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update daily activity graph"
          file_pattern: "activity-graph.svg language-stats.svg"
